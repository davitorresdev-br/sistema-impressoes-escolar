# nginx na frente do servidor — Sistema de Impressão do Colégio Ranieri.
#
# Instalar:
#   sudo cp deploy/ubuntu/nginx-acalanto.conf /etc/nginx/sites-available/acalanto
#   sudo ln -sf /etc/nginx/sites-available/acalanto /etc/nginx/sites-enabled/acalanto
#   sudo rm -f /etc/nginx/sites-enabled/default    # tira a página "Welcome to nginx"
#   sudo nginx -t && sudo systemctl reload nginx
#
# O nginx encaminha TUDO para o waitress (que já serve a tela compilada e a
# API). É um desenho de menos peças: uma só fonte da verdade sobre o que é
# servido, e a diferença de desempenho numa rede de escola é irrelevante.

server {
    listen 80;
    listen [::]:80;

    # O nome oficial, o IP da VM e "_" (qualquer outro nome) — os três
    # atendem. Assim o sistema responde tanto para quem digita o endereço
    # quanto para quem tem o IP salvo nos favoritos.
    server_name impressao.exemplo.com.br 192.168.0.50 _;

    # ------------------------------------------------------------------
    # O AJUSTE MAIS IMPORTANTE DESTE ARQUIVO.
    # O padrão do nginx é 1 MB: sem esta linha, TODA prova com mais de 1 MB
    # é recusada com "413 Request Entity Too Large" ANTES de chegar ao
    # sistema — e a professora vê um erro do nginx, não a mensagem do
    # sistema. O limite real (50 MB) é o do app.py; aqui deixamos uma folga
    # para o envelope do multipart.
    # ------------------------------------------------------------------
    client_max_body_size 55M;

    # Upload de 50 MB pela rede interna não é instantâneo; os padrões de 60s
    # são apertados para a máquina mais lenta do laboratório.
    client_body_timeout 300s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Log próprio, para separar o que é do sistema do resto da máquina.
    access_log /var/log/nginx/acalanto-access.log;
    error_log  /var/log/nginx/acalanto-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # X-Forwarded-For é o que devolve ao sistema o IP REAL de quem está
        # acessando. Sem ele (e sem ACALANTO_ATRAS_DE_PROXY=true no .env),
        # todo mundo chega como 127.0.0.1 e o limite de tentativas de login
        # passa a trancar o colégio inteiro de uma vez.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O PDF é enviado direto ao aplicativo, sem o nginx guardar o corpo
        # inteiro em disco antes de repassar.
        proxy_request_buffering off;
    }
}

# ----------------------------------------------------------------------
# HTTPS — possível DE VERDADE aqui, porque o nome é um domínio real.
#
# `impressao.exemplo.com.br` é um domínio que o colégio controla, e
# isso muda o cenário: dá para obter um certificado Let's Encrypt
# LEGÍTIMO, mesmo o servidor sendo só de rede interna. Certificado de
# verdade significa nenhum aviso de "site não seguro" no navegador dos
# professores e nenhuma configuração extra no agente.
#
# O caminho é o desafio DNS-01 (e não o HTTP-01): o Let's Encrypt valida o
# domínio por um registro TXT no DNS, sem precisar alcançar o servidor pela
# internet — que é justamente o caso, já que 192.168.0.50 é um IP privado.
#
#   sudo apt install certbot
#   sudo certbot certonly --manual --preferred-challenges dns \
#        -d impressao.exemplo.com.br
#
# O certbot pede para criar um registro TXT (_acme-challenge...) no DNS do
# exemplo.com.br. Com um plugin do provedor de DNS, a renovação a
# cada 90 dias fica automática; no modo --manual ela é manual — e um
# certificado vencido derruba o acesso, então vale configurar o plugin ou
# um lembrete no calendário.
#
# Depois de emitir, descomente o bloco abaixo, troque o `listen 80` do
# bloco de cima por um redirecionamento e recarregue o nginx.
# ----------------------------------------------------------------------
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name impressao.exemplo.com.br 192.168.0.50;
#
#     ssl_certificate     /etc/letsencrypt/live/impressao.exemplo.com.br/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/impressao.exemplo.com.br/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     client_max_body_size 55M;
#     client_body_timeout 300s;
#     proxy_read_timeout 300s;
#
#     location / {
#         proxy_pass http://127.0.0.1:8080;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_request_buffering off;
#     }
# }
#
# E, no bloco da porta 80, trocar o conteúdo por:
#     return 301 https://$host$request_uri;
#
# ATENÇÃO ao agente: ao migrar para HTTPS, o `agente.env` do PC da
# impressora precisa passar a apontar para https://impressao...com.br. Com
# certificado do Let's Encrypt isso funciona sem mais nada; com certificado
# autoassinado, o `requests` recusaria a conexão.
